apiVersion: v1
kind: Secret
metadata:
  name: rag-runtime
  namespace: rag-chatbot
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://APP_ROLE:ENCODED_PASSWORD@MANAGED_POSTGRES:5432/chatbot?sslmode=verify-full
  REDIS_URL: rediss://:ENCODED_PASSWORD@MANAGED_REDIS:6379/0
  OPENAI_API_KEY: REPLACE_WITH_REAL_API_KEY
