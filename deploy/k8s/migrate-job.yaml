apiVersion: batch/v1
kind: Job
metadata:
  name: rag-migrate-v1
  namespace: rag-chatbot
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: ghcr.io/your-org/multiagent-rag-chatbot:1.0.0
        command:
        - python
        - -m
        - app.cli
        - migrate
        envFrom:
        - configMapRef:
            name: rag-config
        - secretRef:
            name: rag-migration
        env:
        - name: ENVIRONMENT
          value: development
        - name: PROVIDER
          value: mock
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
