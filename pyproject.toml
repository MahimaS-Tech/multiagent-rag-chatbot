[project]
name = "multiagent-rag-chatbot"
version = "1.0.0"
description = "Tenant-isolated, evidence-checked multiagent RAG with reviewed learning"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests", "integration_tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["integration: needs real disposable external services", "optional: needs LangGraph"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
